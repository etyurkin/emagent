name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check emagent.el and emagent-pkg.el versions match
        run: |
          hdr="$(grep -E '^;; Version:' emagent.el | head -1 \
            | sed -E 's/^;; Version:[[:space:]]*//' | tr -d '[:space:]')"
          pkg="$(grep -E '\(define-package' emagent-pkg.el | head -1 \
            | sed -E 's/.*"emagent"[[:space:]]+"([^"]+)".*/\1/')"
          echo "emagent.el:     $hdr"
          echo "emagent-pkg.el: $pkg"
          if [ -z "$hdr" ] || [ -z "$pkg" ]; then
            echo "Could not parse a version from one of the files" >&2
            exit 1
          fi
          if [ "$hdr" != "$pkg" ]; then
            echo "Version mismatch: emagent.el ($hdr) != emagent-pkg.el ($pkg)" >&2
            exit 1
          fi
          echo "Versions in sync."

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.4
          - 30.1
    steps:
      - uses: actions/checkout@v5

      # Install Nix with an authenticated GitHub token. Anonymous api.github.com
      # calls from Actions IPs frequently 503 on flake commits/HEAD lookups.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}

      # Pin nix-emacs-ci to a commit so Nix does not resolve commits/HEAD.
      - name: Install Emacs ${{ matrix.emacs_version }}
        run: |
          ver="${{ matrix.emacs_version }}"
          attr="emacs-${ver//./-}"
          nix profile install --accept-flake-config \
            "github:purcell/nix-emacs-ci/ca88f42462347e8e17859645aa59b156617e98fb#${attr}"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          emacs --version

      - name: Install Elpaca
        run: git clone --depth 1 https://github.com/progfolio/elpaca.git "$RUNNER_TEMP/elpaca"

      - name: Build with Elpaca and run tests
        env:
          ELPACA_DIR: ${{ runner.temp }}/elpaca
          EMAGENT_ROOT: ${{ github.workspace }}
        run: make ci
