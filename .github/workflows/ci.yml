name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.4
          - 30.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs ${{ matrix.emacs_version }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install Elpaca
        run: git clone --depth 1 https://github.com/progfolio/elpaca.git "$RUNNER_TEMP/elpaca"

      - name: Build with Elpaca and run tests
        env:
          ELPACA_DIR: ${{ runner.temp }}/elpaca
          EMAGENT_ROOT: ${{ github.workspace }}
        run: make ci
