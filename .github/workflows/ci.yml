name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check emagent.el and emagent-pkg.el versions match
        run: |
          hdr="$(grep -E '^;; Version:' emagent.el | head -1 \
            | sed -E 's/^;; Version:[[:space:]]*//' | tr -d '[:space:]')"
          pkg="$(grep -E '\(define-package' emagent-pkg.el | head -1 \
            | sed -E 's/.*"emagent"[[:space:]]+"([^"]+)".*/\1/')"
          echo "emagent.el:     $hdr"
          echo "emagent-pkg.el: $pkg"
          if [ -z "$hdr" ] || [ -z "$pkg" ]; then
            echo "Could not parse a version from one of the files" >&2
            exit 1
          fi
          if [ "$hdr" != "$pkg" ]; then
            echo "Version mismatch: emagent.el ($hdr) != emagent-pkg.el ($pkg)" >&2
            exit 1
          fi
          echo "Versions in sync."

  package-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-substituters = https://emacs-ci.cachix.org
            extra-trusted-public-keys = emacs-ci.cachix.org-1:B5FVOrxhXXrOL0S+tQ7USrhjMT5iOPH+QN9q0NItom4=

      - name: Checkout nix-emacs-ci
        uses: actions/checkout@v5
        with:
          repository: purcell/nix-emacs-ci
          ref: ca88f42462347e8e17859645aa59b156617e98fb
          path: nix-emacs-ci

      - name: Install Emacs 30.1
        run: |
          nix profile install --accept-flake-config "./nix-emacs-ci#emacs-30-1"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          "$HOME/.nix-profile/bin/emacs" --version

      - name: package-lint emagent.el
        env:
          EMAGENT_ROOT: ${{ github.workspace }}
        run: make package-lint

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.4
          - 30.1
    steps:
      - uses: actions/checkout@v5

      # Anonymous api.github.com flake lookups (commits/HEAD) are currently
      # returning 503 from Actions IPs. Install Nix with a token and pull
      # nix-emacs-ci via git so `nix profile install` uses a local flake path.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-substituters = https://emacs-ci.cachix.org
            extra-trusted-public-keys = emacs-ci.cachix.org-1:B5FVOrxhXXrOL0S+tQ7USrhjMT5iOPH+QN9q0NItom4=

      - name: Checkout nix-emacs-ci
        uses: actions/checkout@v5
        with:
          repository: purcell/nix-emacs-ci
          ref: ca88f42462347e8e17859645aa59b156617e98fb
          path: nix-emacs-ci

      - name: Install Emacs ${{ matrix.emacs_version }}
        run: |
          ver="${{ matrix.emacs_version }}"
          attr="emacs-${ver//./-}"
          nix profile install --accept-flake-config "./nix-emacs-ci#${attr}"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          "$HOME/.nix-profile/bin/emacs" --version

      - name: Install Elpaca
        run: git clone --depth 1 https://github.com/progfolio/elpaca.git "$RUNNER_TEMP/elpaca"

      - name: Build with Elpaca and run tests
        env:
          ELPACA_DIR: ${{ runner.temp }}/elpaca
          EMAGENT_ROOT: ${{ github.workspace }}
        run: make ci
