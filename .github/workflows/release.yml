name: Release

# Publish a release whenever the Version header in emagent.el changes on main.
# MELPA Stable builds from git tags, so pushing v<version> is what publishes a
# new stable release; the GitHub Release is created alongside it.

on:
  push:
    branches: [main]
    paths:
      - emagent.el

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from emagent.el
        id: ver
        run: |
          version="$(grep -E '^;; Version:' emagent.el | head -1 \
            | sed -E 's/^;; Version:[[:space:]]*//' | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "Could not find a Version header in emagent.el" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag if it does not exist
        id: tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Pushed $TAG."

      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          TITLE: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "$TAG" --title "$TITLE" --generate-notes
          echo "Created GitHub Release $TITLE."
